name: NixOS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        target:
          - type: input
            name: denial
            flake_refs: >-
              denial#default
              denial#denial
              denial#denial-cachix-cli
              denial#denial-flutter
              denial#denial-flutter-dart
              denial#denial-flutter-depot-tools-source
              denial#denial-flutter-engine
              denial#denial-flutter-engine-raw
              denial#denial-flutter-engine-source
              denial#denial-flutter-engine-source-build
              denial#denial-flutter-framework-source
              denial#denial-nix-maintenance-tools
              denial#denial-plugin-manager
              denial#denial-unstable
          - type: output
            name: azure
            flake_refs: .#nixosConfigurations.azure.config.system.build.toplevel
          - type: output
            name: homelab
            flake_refs: .#nixosConfigurations.homelab.config.system.build.toplevel
          - type: output
            name: zed_net
            flake_refs: .#nixosConfigurations.zed_net.config.system.build.toplevel

    steps:
      - uses: actions/checkout@v7

      - name: "Free disk space for Nix"
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'Rampage' # holster, carve, cleave (default), rampage

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.11.0

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-cache
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Mount tmp"
        run: sudo mkdir /nix/tmp && sudo mount --bind /nix/tmp /tmp

      - name: "Build ${{ matrix.target.name }} input packages ❄️"
        if: matrix.target.type == 'input'
        run: nix build --inputs-from . ${{ matrix.target.flake_refs }} --accept-flake-config

      - name: "Build ${{ matrix.target.name }} NixOS config ❄️"
        if: matrix.target.type == 'output'
        run: nix build "${{ matrix.target.flake_refs }}" --accept-flake-config
