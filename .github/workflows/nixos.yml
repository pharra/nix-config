name: NixOS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        target:
          - type: input
            name: denial
            flake_ref: denial#default
          - type: nixos
            name: azure
            flake_ref: .#nixosConfigurations.azure.config.system.build.toplevel
          - type: nixos
            name: homelab
            flake_ref: .#nixosConfigurations.homelab.config.system.build.toplevel
          - type: nixos
            name: zed_net
            flake_ref: .#nixosConfigurations.zed_net.config.system.build.toplevel

    steps:
      - uses: actions/checkout@v7

      - name: "Free disk space for Nix"
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'Rampage' # holster, carve, cleave (default), rampage

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.11.0

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-cache
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Mount tmp"
        run: sudo mkdir /nix/tmp && sudo mount --bind /nix/tmp /tmp

      - name: "Build ${{ matrix.target.name }} input package ❄️"
        if: matrix.target.type == 'input'
        run: nix build --inputs-from . "${{ matrix.target.flake_ref }}" --accept-flake-config --option substituters "https://nixpkgs-cache.cachix.org" --option trusted-public-keys "nixpkgs-cache.cachix.org-1:7wZaApmfSKiDpxKAxwd+dExeWFMbilDnOgIqAdDh3T4="

      - name: "Build ${{ matrix.target.name }} NixOS config ❄️"
        if: matrix.target.type == 'nixos'
        run: nix build "${{ matrix.target.flake_ref }}" --accept-flake-config --option substituters "https://nixpkgs-cache.cachix.org" --option trusted-public-keys "nixpkgs-cache.cachix.org-1:7wZaApmfSKiDpxKAxwd+dExeWFMbilDnOgIqAdDh3T4="
