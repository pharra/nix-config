name: NixOS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  # 全量求值：24 个 <host>_<build> 配置一个不漏地 eval 一遍。
  # 只求值不编译，几分钟内就能发现"某个 host/build 组合被改坏了"，
  # 比下面的编译矩阵便宜得多，所以放在最前面。
  eval:
    name: "Eval all configurations ❄️"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.11.0

      - name: "Eval all nixosConfigurations"
        run: |
          nix eval --raw .#nixosConfigurations \
            --accept-flake-config \
            --apply 'x: (builtins.concatStringsSep "\n" (builtins.sort (a: b: a < b) (builtins.map (n: "${n} ${x.${n}.config.system.build.toplevel.drvPath}") (builtins.attrNames x)))) + "\n"'

  # 格式检查：用 flake 自己声明的 formatter（alejandra），保证 CI 与 nix fmt 一致。
  format:
    name: "Format (alejandra) ✨"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.11.0

      - name: "Check formatting"
        run: nix fmt -- --check .

  # 静态检查：仓库里还有既存的 statix / deadnix 告警（如未被使用的 lambda 形参），
  # 所以这一步先只报告、不阻断合并；清理干净后可以去掉 continue-on-error。
  lint:
    name: "Lint (statix / deadnix) 🔍"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.11.0

      - name: "statix"
        run: nix run nixpkgs#statix -- check .

      - name: "deadnix"
        run: nix run nixpkgs#deadnix -- .

  # 构建矩阵由 flake 输出 ciMatrix 派生（数据来自 hosts/registry.nix 的 ci 字段），
  # 所以"加一台机器要不要进 CI"只在 registry 里标注，不用改这个 workflow。
  matrix:
    name: "Build matrix 🧮"
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.set.outputs.configs }}
    steps:
      - uses: actions/checkout@v7

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.11.0

      - name: "Read ciMatrix from the flake"
        id: set
        run: echo "configs=$(nix eval --json .#ciMatrix --accept-flake-config)" >> "$GITHUB_OUTPUT"

  # 编译矩阵：只挑少量代表性配置真正构建（内核 / 服务器 / 桌面 / 网络启动各一），
  # 其余配置由上面的 eval 任务兜底。
  build:
    name: "Build ${{ matrix.config_name }} ❄️"
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        config_name: ${{ fromJSON(needs.matrix.outputs.configs) }}

    steps:
      - uses: actions/checkout@v7

      - name: "Free disk space for Nix"
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'Rampage' # holster, carve, cleave (default), rampage

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.11.0

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-cache
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Mount tmp"
        run: sudo mkdir /nix/tmp && sudo mount --bind /nix/tmp /tmp

      - name: "Build ${{ matrix.config_name }} NixOS config ❄️"
        run: nix build .#nixosConfigurations.${{ matrix.config_name }} --accept-flake-config --option substituters "https://nixpkgs-cache.cachix.org" --option trusted-public-keys "nixpkgs-cache.cachix.org-1:7wZaApmfSKiDpxKAxwd+dExeWFMbilDnOgIqAdDh3T4="
