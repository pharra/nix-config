name: NixOS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  # 构建时使用的 Nix 二进制缓存与公钥，只改这两个变量即可。
  # 它们会写进 /etc/nix/nix.conf，因此下面的 build 步骤不带 --accept-flake-config：
  # flake.nix 中的 nixConfig.substituters 会整体覆盖这里的列表。
  NIX_SUBSTITUTERS: >-
    https://cache.nixos.org
    https://nixpkgs-cache.cachix.org
    https://nix-community.cachix.org
    https://denial.cachix.org
    https://cache.lantian.pub/lantian
  NIX_TRUSTED_PUBLIC_KEYS: >-
    cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    nixpkgs-cache.cachix.org-1:7wZaApmfSKiDpxKAxwd+dExeWFMbilDnOgIqAdDh3T4=
    nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
    denial.cachix.org-1:wd8YTnvPmugFrtdMJWtR1XdVknR3/g2nmBJkT+vAruo=
    lantian:WVGO7vsRMSEN+h7Lp7kv6SAmrkEXgUGbbXm7jMDjBuQ=

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        target:
          # - type: input
          #   name: denial
          #   flake_refs: >-
          #     denial#default
          #     denial#denial
          #     denial#denial-cachix-cli
          #     denial#denial-flutter
          #     denial#denial-flutter-dart
          #     denial#denial-flutter-depot-tools-source
          #     denial#denial-flutter-engine
          #     denial#denial-flutter-engine-raw
          #     denial#denial-flutter-engine-source
          #     denial#denial-flutter-engine-source-build
          #     denial#denial-flutter-framework-source
          #     denial#denial-nix-maintenance-tools
          #     denial#denial-plugin-manager
          #     denial#denial-unstable
          - type: output
            name: azure
            flake_refs: .#nixosConfigurations.azure.config.system.build.toplevel
          - type: output
            name: homelab
            flake_refs: .#nixosConfigurations.homelab.config.system.build.toplevel
          - type: output
            name: denial_example
            flake_refs: .#nixosConfigurations.denial_example.config.system.build.toplevel

    steps:
      - uses: actions/checkout@v7

      - name: "Free disk space for Nix"
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'Rampage' # holster, carve, cleave (default), rampage

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            substituters = ${{ env.NIX_SUBSTITUTERS }}
            trusted-public-keys = ${{ env.NIX_TRUSTED_PUBLIC_KEYS }}

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-cache
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Mount tmp"
        run: sudo mkdir /nix/tmp && sudo mount --bind /nix/tmp /tmp

      - name: "Build ${{ matrix.target.name }} input packages ❄️"
        if: matrix.target.type == 'input'
        run: nix build --inputs-from . ${{ matrix.target.flake_refs }}

      - name: "Build ${{ matrix.target.name }} NixOS config ❄️"
        if: matrix.target.type == 'output'
        run: nix build "${{ matrix.target.flake_refs }}"
